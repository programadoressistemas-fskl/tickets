<div class="pagetitle">
    <h1>Usuarios</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Usuarios</li>
            <li class="breadcrumb-item active">Consulta Usuarios</li>
        </ol>
    </nav>
</div>

<section class="section dashboard">
    <div class="row">
        <div class="col-12">

            <div class="card">
                <div class="card-body row g-3">
                    <div class="botonera">
                        <button class="btn btn-success btn-sm">
                            Exportar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Telefono</th>
                        <th>Correo</th>
                        <th>Puesto</th>
                        <th>Activo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let usuario of datosTabla">
                        <td>{{usuario.nombre}}</td>
                        <td>{{usuario.numero_telefono}}</td>
                        <td>{{usuario.correo_electronico}}</td>
                        <td>{{usuario.puesto}}</td>
                        <td>{{usuario.estado}}</td>
                        <td class="text-medium">
                            <button class="btn btn-sm btn-outline-primary" (click)="abrirModalRegistrarUsuario()">
                                <i class="bi bi-pencil"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
