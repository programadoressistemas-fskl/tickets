<div class="modal-body dashboard">
    <div class="pagetitle">
        <h4 class="t-bold">
            {{pkUsuario == null ? 'Registrar' : 'Actualizar'}} usuario
        </h4> 
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Usuarios</li>
                <li class="breadcrumb-item active">{{pkUsuario == null ? 'Registrar' : 'Actualizar'}} usuario</li>
            </ol>
        </nav>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form [formGroup]="formUsuario" class="row g-3" autocomplete="off">
                        <div class="col-lg-4">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input id="nombre" type="text" class="form-control form-control-sm" placeholder="Nombre"
                                formControlName="nombre">
                        </div>
                        <div class="col-lg-4">
                            <label for="a_paterno" class="form-label">Apellido paterno:</label>
                            <input id="a_paterno" type="text" class="form-control form-control-sm"
                                placeholder="Apellido paterno" formControlName="a_paterno">
                        </div>
                        <div class="col-lg-4">
                            <label for="a_materno" class="form-label">Apellido materno:</label>
                            <input id="a_materno" type="text" class="form-control form-control-sm"
                                placeholder="Apellido materno" formControlName="a_materno">
                        </div>
                        <div class="col-lg-8">
                            <label for="correo_electronico" class="form-label">Correo:</label>
                            <input id="correo_electronico" type="email" class="form-control form-control-sm" placeholder="correo electronico"
                                formControlName="correo_electronico">
                        </div>
                        <div class="col-lg-4">
                            <label for="numero_telefono" class="form-label">Teléfono:</label>
                            <input id="numero_telefono" type="tel" class="form-control form-control-sm" placeholder="numero telefonico"
                                formControlName="numero_telefono">
                        </div>
                        <div class="col-lg-4">
                            <label for="password" class="form-label">Contraseña:</label>
                            <input id="password" type="password" class="form-control form-control-sm"
                                placeholder="Contraseña" formControlName="password">
                        </div>
                        <div class="col-lg-4">
                            <label for="area" class="form-label">Area:</label>
                            <select name="area" id="area" class="form-select form-select-sm" formControlName="id_area">
                                <option *ngFor="let area of listaAreas" [value]="area.id_area">
                                    {{ area.area }}
                                </option>
                                <option style="display: none; visibility: hidden;" value="">Selecciona una opción
                                </option>
                            </select>
                        </div>

                        <div class="col-lg-4">
                            <label for="puesto" class="form-label">Puesto:</label>
                            <input id="puesto" type="text" class="form-control form-control-sm" placeholder="Puesto"
                                formControlName="puesto">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button *ngIf="pkUsuario == null" class="btn btn-sm btn-primary" (click)="registrarUsuario()">
        Registrar
    </button>
    <button *ngIf="pkUsuario != null" class="btn btn-sm btn-warning">
        Actualizar
    </button>
    <button class="btn btn-sm btn-danger" (click)="cerrarModal()">
        {{cambiosForm || pkUsuario != null ? 'Cancelar' : 'Cerrar'}}
    </button>
</div>
