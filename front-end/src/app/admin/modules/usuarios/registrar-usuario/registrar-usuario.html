<div class="modal-body dashboard">
    <div class="pagetitle">
        <h4 class="t-bold">
            Registrar usuario
        </h4>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Usuarios</li>
                <li class="breadcrumb-item active">Registrar usuario</li>
            </ol>
        </nav>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form class="row g-3" autocomplete="off">
                        <div class="col-lg-4">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" class="form-control form-control-sm" placeholder="Nombre">
                        </div>
                        <div class="col-lg-4">
                            <label for="a_paterno" class="form-label">Apellido paterno:</label>
                            <input type="text" class="form-control form-control-sm" placeholder="Apellido paterno">
                        </div>
                        <div class="col-lg-4">
                            <label for="a_materno" class="form-label">Apellido materno:</label>
                            <input type="text" class="form-control form-control-sm" placeholder="Apellido materno">
                        </div>
                        <div class="col-lg-8">
                            <label for="correo" class="form-label">Correo:</label>
                            <input type="email" class="form-control form-control-sm" placeholder="Correo">
                        </div>
                        <div class="col-lg-4">
                            <label for="telefono" class="form-label">Teléfono:</label>
                            <input type="tel" class="form-control form-control-sm" placeholder="Teléfono">
                        </div>
                        <div class="col-lg-4">
                            <label for="password" class="form-label">Contraseña:</label>
                            <input type="password" class="form-control form-control-sm" placeholder="Contraseña">
                        </div>
                        <div class="col-lg-4">
                            <label for="area" class="form-label">Area:</label>
                            <select name="area" id="area" class="form-select form-select-sm">
                                <option *ngFor="let area of listaAreas" [value]="area.id">
                                    {{ area.area }}
                                </option>
                                <option style="display: none; visibility: hidden;" value="">Selecciona una opción</option>
                            </select>
                        </div>

                        <div class="col-lg-4">
                            <label for="puesto" class="form-label">Puesto:</label>
                            <input type="text" class="form-control form-control-sm" placeholder="Puesto">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-sm btn-primary">
        Registrar
    </button>
    <button class="btn btn-sm btn-danger" (click)="cerrarModal()">
        Cerrar
    </button>
</div>
