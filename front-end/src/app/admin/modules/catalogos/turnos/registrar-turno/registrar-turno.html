<div class="modal-body dashboard">
    <div class="pagetitle">
        <h4 class="t-bold">
            {{pkTurno == null ? 'Registrar' : 'Actualizar'}} turno
        </h4>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Turnos</li>
                <li class="breadcrumb-item active">{{pkTurno == null ? 'Registrar' : 'Actualizar'}} turno</li>
            </ol>
        </nav>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form [formGroup]="formTurno" class="row g-3" autocomplete="off">
                        <div class="col-lg-md text-center">
                            <label for="turno" class="form-label">Turno:</label>
                            <input id="turno" type="text"
                                class="form-control form-control-sm text-center input-respuesta mx-auto"
                                placeholder="Turno" formControlName="turno"> 
                        </div> 
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-sm btn-primary" (click)="registrarTurno()">
        Registrar
    </button>
    <button class="btn btn-sm btn-danger" (click)="cerrarModal()">
        Cerrar
    </button>
</div>
