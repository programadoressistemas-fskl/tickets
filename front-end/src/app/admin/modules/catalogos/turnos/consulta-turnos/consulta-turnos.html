<div class="pagetitle">
    <h1>Turnos</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Turnos</li>
            <li class="breadcrumb-item active">Consulta Turnos</li>
        </ol>
    </nav>
</div>

<section class="section dashboard">
    <div class="row">
        <div class="col-12">

            <div class="card">
                <div class="card-body row g-3">
                    <div class="botonera">
                        <button class="btn btn-success btn-sm">
                            Exportar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" style="margin-top: 20px !important;">
            <table class="table table-striped table-hover text-center">
                <thead>
                    <tr>
                        <th>Folio</th>
                        <th>Turno</th>
                        <th>Activo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let turno of datosTabla">
                        <td>{{turno.folio}}</td>
                        <td>{{turno.turno}}</td>
                        <td>{{turno.estado}}</td>
                        <td class="text-medium">
                            <button class="btn btn-sm btn-outline-primary"
                                (click)="abrirModalRegistrarTurno(turno.id_turno)">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button *ngIf="!turno.activo" class="btn btn-sm btn-outline-info"
                                (click)="cambiarStatusTurno(turno)">
                                <i class="bi bi-check"></i>
                            </button>
                            <button *ngIf="turno.activo" class="btn btn-sm btn-outline-warning"
                                (click)="cambiarStatusTurno(turno)">
                                <i class="bi bi-x"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
