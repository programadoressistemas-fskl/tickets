<div class="modal-body dashboard">
    <div class="pagetitle">
        <h4 class="t-bold">
            {{pkArea == null ? 'Registrar' : 'Actualziar'}} area
        </h4>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Area</li>
                <li class="breadcrumb-item active"> {{pkArea == null ? 'Registrar' : 'Actualziar'}} area</li>
            </ol>
        </nav>
    </div>

    <div class="row">
        <div class="col-12" style="margin-top: 20px !important;">
            <div class="card">
                <div class="card-body">
                    <form [formGroup]="formArea" class="row g-3" autocomplete="off">
                        <div class="col-lg-12 text-center">
                            <label for="area" class="form-label" >Area:</label>
                            <input id="area" type="text" class="form-control form-control-sm" placeholder="area"
                                formControlName="area">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-sm btn-primary" (click)="registrarArea()">
        Registrar
    </button>
    <button class="btn btn-sm btn-danger" (click)="cerrarModal()">
        Cerrar
    </button>
</div>
