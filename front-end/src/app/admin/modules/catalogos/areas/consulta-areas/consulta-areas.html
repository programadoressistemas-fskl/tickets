<div class="pagetitle">
    <h1>Areas</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Areas</li>
            <li class="breadcrumb-item active">Consulta Areas</li>
        </ol>
    </nav>
</div>

<section class="section dashboard">
    <div class="row">
        <div class="col-12">

            <div class="card">
                <div class="card-body row g-3">
                    <div class="botonera">
                        <button class="btn btn-success btn-sm">
                            Exportar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Area</th>
                        <th>activo</th>
                    </tr>
                </thead> 
                <tbody>
                    <tr *ngFor="let area of datosTabla">
                        <td>{{area.area}}</td>
                        <td>{{area.activo}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
