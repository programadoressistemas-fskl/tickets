<div class="pagetitle">
    <h1>Tipo de Servicio</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Tipos de Servicio</li>
            <li class="breadcrumb-item active">Consulta Tipos de Servicio</li>
        </ol>
    </nav>
</div>

<section class="section dashboard">
    <div class="row">
        <div class="col-12">

            <div class="card">
                <div class="card-body row g-3">
                    <div class="botonera">
                        <button class="btn btn-success btn-sm">
                            Exportar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" style="margin-top: 20px !important;">
            <table class="table table-striped table-hover text-center ">
                <thead>
                    <tr>
                        <th>Tipo Servicio</th>
                        <th>Descripcion</th>
                        <th>Activo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let tiposServicio of datosTabla">
                        <td>{{tiposServicio.tipo_servicio}}</td>
                        <td>{{tiposServicio.descripcion}}</td>
                        <td>{{tiposServicio.estado}}</td>
                        <td class="text-medium">
                            <button class="btn btn-sm btn-outline-primary"
                                (click)="abrirModalRegistrarTipoServicio(tiposServicio.id_tipo_servicio)">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button *ngIf="!tiposServicio.activo" class="btn btn-sm btn-outline-info"
                                (click)="cambiarStatustiposServicio(tiposServicio)">
                                <i class="bi bi-check"></i>
                            </button>
                            <button *ngIf="tiposServicio.activo" class="btn btn-sm btn-outline-warning"
                                (click)="cambiarStatustiposServicio(tiposServicio)">
                                <i class="bi bi-x"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
