<div class="pagetitle">
    <h1>Plantas</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Plantas</li>
            <li class="breadcrumb-item active">Consulta Plantas</li>
        </ol>
    </nav>
</div>

<section class="section dashboard">
    <div class="row">
        <div class="col-12">

            <div class="card">
                <div class="card-body row g-3">
                    <div class="botonera">
                        <button class="btn btn-success btn-sm">
                            Exportar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Planta</th>
                        <th>abrev</th>
                        <th>direccion</th>
                        <th>activo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let planta of datosTabla">
                        <td>{{planta.planta}}</td>
                        <td>{{planta.abrev}}</td>
                        <td>{{planta.direccion}}</td>
                        <td>{{planta.estado}}</td>
                        <td class="text-medium">
                            <button class="btn btn-sm btn-outline-primary" (click)="abrirModalRegistrarPlanta()">
                                <i class="bi bi-pencil"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
