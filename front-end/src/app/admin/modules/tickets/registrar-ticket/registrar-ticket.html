<div class="modal-body dashboard">
	<div class="pagetitle">
		<h4 class="t-bold">
			{{ pkTicket == null ? 'Registrar' : 'Actualizar'}} ticket
		</h4>

		<nav>
			<ol class="breadcrumb">
				<li class="breadcrumb-item">Tickets</li>
				<li class="breadcrumb-item active">
					{{ pkTicket == null ? 'Registrar' : 'Actualizar'}} ticket
				</li>
			</ol>
		</nav>
	</div>

	<div class="row">
		<div class="col-12">
			<div class="card">
				<div class="card-body">

					<form [formGroup]="formTicket" class="row g-3" autocomplete="off">

						<div class="col-lg-6">
							<label class="form-label">Area:</label>
							<select class="form-select form-select-sm" formControlName="id_area">
								<option *ngFor="let area of listaAreas" [value]="area.id_area">
									{{ area.area }}
								</option>
								<option style="display: none; visibility: hidden;" value="">
									Selecciona una opción
								</option>
							</select>
						</div>

						<div class="col-lg-6">
							<label class="form-label">Planta:</label>
							<select class="form-select form-select-sm" formControlName="id_planta">
								<option *ngFor="let planta of listaPlantas" [value]="planta.id_planta">
									{{ planta.planta }}
								</option>
								<option style="display: none; visibility: hidden;" value="">
									Selecciona una opción
								</option>
							</select>
						</div>

						<div class="col-lg-6">
							<label class="form-label">Turno:</label>
							<select class="form-select form-select-sm" formControlName="id_turno">
								<option *ngFor="let turno of listaTurnos" [value]="turno.id_turno">
									{{ turno.turno }}
								</option>
								<option style="display: none; visibility: hidden;" value="">
									Selecciona una opción
								</option>
							</select>
						</div>

						<div class="col-lg-6">
							<label class="form-label">Tipo Servicio:</label>
							<select class="form-select form-select-sm" formControlName="id_tipo_servicio">
								<option *ngFor="let tipo of listatiposServicio" [value]="tipo.id_tipo_servicio">
									{{ tipo.tipo_servicio }}
								</option>
								<option style="display: none; visibility: hidden;" value="">
									Selecciona una opción
								</option>
							</select>
						</div>

						<div class="col-lg-12">
							<label class="form-label">Descripción:</label>
							<textarea class="form-control form-control-sm" rows="3"
								formControlName="descripcion_problema">
              </textarea>
						</div>

						<div class="col-lg-12 mt-3">
							<label class="form-label">Evidencias:</label>

							<div class="mb-2">
								<button type="button" class="btn btn-sm btn-primary" (click)="fileInput.click()">
									Agregar imagen
								</button>

								<input #fileInput type="file" multiple accept="image/*"
									(change)="onFileSelected($event)" hidden>
							</div>

							<div class="d-flex flex-wrap gap-3">

								<div *ngFor="let img of images; let i = index" class="position-relative">

									<img [src]="img.url_evidencia" width="120" height="120" class="rounded border"
										style="object-fit: cover;">

									<button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0"
										(click)="eliminarEvidenciaTicket(i, img.id_ticket_evidencia)"
										style="padding: 2px 6px;">
										<i class="bi bi-x"></i>
									</button>

								</div>

							</div>
						</div>

					</form>

				</div>
			</div>
		</div>
	</div>
</div>

<div class="modal-footer">

	<button *ngIf="pkTicket == null" class="btn btn-sm btn-primary" (click)="registrarTicket()">
		Registrar
	</button>

	<button *ngIf="pkTicket != null" class="btn btn-sm btn-warning" (click)="actualizarTicket()">
		Actualizar
	</button>

	<button class="btn btn-sm btn-primary" (click)="abrirAsignar()">
		Asignar a
	</button>

	<button class="btn btn-sm btn-danger" (click)="cerrarModal()">
		{{ cambiosForm || pkTicket != null ? 'Cancelar' : 'Cerrar' }}
	</button>

</div>
