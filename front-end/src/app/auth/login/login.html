<div id="layoutAuthentication" class="bg-dark min-vh-100 d-flex flex-column">
    <div id="layoutAuthentication_content" class="flex-grow-1">
        <main>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-5 col-md-7 col-sm-9">

                        <div class="text-center mt-5 mb-5 logo-glow-container">
                            <img src="assets/images/Logo_FASKE3PL.png"
                                 alt="FASKE INDUSTRIAL"
                                 class="img-fluid logo-glow"
                                 style="max-height: 100px; width: auto;">
                        </div>

                        <div class="card shadow-lg border-0 rounded-lg card-glow">
                            <div class="card-header border-bottom-0 pt-4">
                                <h3 class="text-center font-weight-light my-3 text-uppercase" style="letter-spacing: 2px;">
                                    Login
                                </h3>
                            </div>

                            <div class="card-body px-4 px-md-5 pb-5">
                                <form [formGroup]="formLogin" autocomplete="off">
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="inputEmail" type="email" formControlName="correo">
                                        <label for="inputEmail" class="text-muted">
                                            <i class="bi bi-envelope-at me-2"></i>Correo
                                        </label>
                                    </div>

                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="inputPassword" type="password" placeholder="Contraseña" formControlName="password">
                                        <label for="inputPassword" class="text-muted">
                                            <i class="bi bi-pencil-square me-2"></i>Contraseña
                                        </label>
                                    </div>

                                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0 small">
                                        <a class="text-decoration-none text-secondary d-flex align-items-center" href="password.html">
                                            <i class="bi bi-question-circle-fill me-1"></i>
                                            ¿Olvidó su contraseña?
                                        </a>
                                    </div>

                                    <div class="d-grid mt-4">
                                        <button class="btn btn-dark btn-block py-2" type="submit" (click)="iniciarSesion()" >ENTRAR</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="layoutAuthentication_footer">
        <footer class="py-4 mt-auto">
            <div class="container-fluid px-4 text-center">
                <div class="small text-white-50"> &copy; FASKE INDUSTRIAL</div>
            </div>
        </footer>
    </div>
</div>
