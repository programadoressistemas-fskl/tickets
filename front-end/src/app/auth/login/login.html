<div class="container-fluid min-vh-100 p-0">
    <div class="row g-0 h-100">
        <div class="col-md-6 d-none d-md-flex login-left">

            <div class="login-content text-white text-center">
                <img src="assets/images/Logo_FASKE3PL.png" class="img-fluid mb-4 logo-img">
                <h2 class="fw-bold">
                    Sistema de <span class="text-warning">Tickets</span>
                </h2>

                <p class="mt-3">
                    Plataforma de soporte IT para reportar problemas
                    y dar seguimiento a tus solicitudes.
                </p>

            </div>

        </div>

        <div class="col-md-6 d-flex align-items-center justify-content-center login-right">

            <div class="login-box">
                <h4 class="text-center mb-4 titulo-login">Acceder al Sistema</h4>
                 <p class="mt-3">
                    Gestiona tus Tickets de soporte IT de forma rápida y sencilla,
                    Reporta fallas y recibe ayuda en minutos.
                </p>
                
                <div class="card shadow border-0 rounded-4 card-glow">

                    <div class="card-body p-4">

                        <form [formGroup]="formLogin" autocomplete="off">

                            <div class="form-floating mb-3">
                                <input class="form-control" type="email" formControlName="correo">
                                <label>Correo</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input class="form-control" type="password" formControlName="password">
                                <label>Contraseña</label>
                            </div>

                            <div class="d-grid">
                                <button class="btn btn-warning" (click)="iniciarSesion()">
                                    Iniciar Sesión
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>

        </div>

    </div>
</div>
